<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Sapat transcription workflow in Daytona</title>
  <desc id="desc">A left-to-right workflow diagram showing a Daytona workspace running Sapat, FFmpeg audio extraction, a Whisper provider adapter, optional correction, and transcript outputs.</desc>
  <defs>
    <linearGradient id="workspace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EEF6FF"/>
      <stop offset="1" stop-color="#D9EDFF"/>
    </linearGradient>
    <linearGradient id="provider" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F0FDF4"/>
      <stop offset="1" stop-color="#DCFCE7"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M2,2 L10,6 L2,10 Z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="1200" height="520" rx="24" fill="#F8FAFC"/>
  <rect x="36" y="36" width="1128" height="448" rx="22" fill="#FFFFFF" stroke="#DDE7F2"/>
  <text x="70" y="86" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#0F172A">AI transcription workflow in Daytona</text>
  <text x="70" y="118" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" fill="#475569">Keep deterministic media preparation, model-provider calls, and transcript output in separate, testable steps.</text>

  <g filter="url(#shadow)">
    <rect x="70" y="170" width="190" height="150" rx="18" fill="url(#workspace)" stroke="#93C5FD"/>
    <text x="100" y="214" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#0F172A">Daytona workspace</text>
    <text x="100" y="244" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" fill="#334155">Git repo, Python venv,</text>
    <text x="100" y="266" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" fill="#334155">FFmpeg, safe secrets</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="322" y="170" width="170" height="150" rx="18" fill="#FFF7ED" stroke="#FDBA74"/>
    <text x="356" y="214" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#0F172A">Sapat CLI</text>
    <text x="350" y="244" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" fill="#334155">Input path, provider,</text>
    <text x="350" y="266" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" fill="#334155">language, quality, prompt</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="552" y="170" width="170" height="150" rx="18" fill="#FDF2F8" stroke="#F9A8D4"/>
    <text x="604" y="214" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#0F172A">FFmpeg</text>
    <text x="586" y="244" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" fill="#334155">Extract MP3 audio</text>
    <text x="586" y="266" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" fill="#334155">and normalize bitrate</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="782" y="170" width="180" height="150" rx="18" fill="url(#provider)" stroke="#86EFAC"/>
    <text x="824" y="214" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#0F172A">Provider adapter</text>
    <text x="812" y="244" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" fill="#334155">OpenAI, Groq,</text>
    <text x="812" y="266" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" fill="#334155">or Azure OpenAI</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1022" y="170" width="110" height="150" rx="18" fill="#F5F3FF" stroke="#C4B5FD"/>
    <text x="1044" y="214" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#0F172A">Output</text>
    <text x="1044" y="244" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" fill="#334155">Transcript</text>
    <text x="1044" y="266" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" fill="#334155">.txt file</text>
  </g>

  <path d="M262 245 H318" stroke="#334155" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M494 245 H548" stroke="#334155" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M724 245 H778" stroke="#334155" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M964 245 H1018" stroke="#334155" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <rect x="322" y="366" width="640" height="56" rx="14" fill="#ECFEFF" stroke="#67E8F9"/>
  <text x="348" y="399" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#0F172A">Optional correction pass</text>
  <text x="540" y="399" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" fill="#334155">Use a chat model to clean punctuation and domain terms after transcription.</text>
  <path d="M872 320 V366" stroke="#334155" stroke-width="3" stroke-dasharray="7 7" fill="none" marker-end="url(#arrow)"/>
  <path d="M962 394 H1077 V324" stroke="#334155" stroke-width="3" stroke-dasharray="7 7" fill="none" marker-end="url(#arrow)"/>
</svg>
